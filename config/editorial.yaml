  target_min_ratio: 0.065
  min_excerpt_seconds: 8
  max_excerpt_seconds: 90
  max_excerpts: 12
  max_themes: 6
  card_mode: group
  card_duration_s: 1.4
  card_fade_s: 0.2
  enable_sfx: true
  enable_bgm: true
  bgm_volume: 0.16
  sfx_volume: 0.35
  duck_threshold: 0.03
  duck_ratio: 6.0
  duck_attack_ms: 40
  duck_release_ms: 350
