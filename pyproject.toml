[project]
name = "clipcut"
version = "0.1.0"
description = "Serious automated video clipping, multimodal highlight verification, and deluxe Remix studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "srt>=3.5.3",
    "pillow>=11.0.0",
    "numpy>=2.1.0",
    "google-genai>=1.10.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
clipcut = "clipcut.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipcut"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
]
